ja:
  simple_form:
    error_notification:
      default_message: 入力内容に誤りがあります。下記の項目を確認してください。
  enums:
    bento:
      bento_type: &bento_types
        japanese: 和食
        western: 洋食
        chinese: 中華
        healthy: ヘルシー
    subscription:
      bento_type: *bento_types
    order:
      status:
        ordered: 注文済
        received: 受取済
        canceled: キャンセル済
  devise:
    failure:
      # NOTE: 管理者は画面から登録できないため、Devise 標準の「アカウント登録してください」を案内しない文言に変えている
      admin:
        unauthenticated: 管理者としてログインしてください。
  date:
    formats:
      with_wday: '%-m/%-d(%a)'
      month: '%Y年%-m月'
  subscription_order_generation:
    skip_reasons:
      already_generated: すでに生成済み（キャンセル済みを含む）
      no_daily_menu: 同じ弁当タイプの販売中の献立がない
      inactive_delivery_area: 配達エリアが無効
      exceeds_daily_limit: 同じ提供日の注文と合わせて 1 日 3 個を超える
  activemodel:
    errors:
      models:
        subscription_order_generation:
          attributes:
            served_on:
              past: に過去の日付は指定できません
              deadline_passed: が当日の場合、生成できるのは %{deadline} までです
              too_far_ahead: は %{days} 日先までにしてください
    attributes:
      subscription_order_generation:
        served_on: 対象日
  activerecord:
    errors:
      models:
        bento:
          attributes:
            image:
              invalid_content_type: は JPEG・PNG・WebP のいずれかにしてください
              too_large: は %{size} 以下にしてください
        daily_menu:
          attributes:
            bento_id:
              bento_type_taken: 'は、%{served_on} に同じ弁当タイプ（%{bento_type}）の献立がすでにあるため選べません'
              ordered_menu_unchangeable: は、注文がある献立のため変更できません
            served_on:
              ordered_menu_unchangeable: は、注文がある献立のため変更できません
        review:
          order_not_received: 評価は、受取済みの注文にだけ投稿できます
          attributes:
            order_id:
              taken: には、すでに評価を投稿しています
        subscription:
          attributes:
            wday:
              taken: の定期注文設定はすでに登録されています。登録済みの設定を編集してください
            delivery_area:
              inactive: は現在配達を受け付けていません
        order:
          bento_not_on_sale: この弁当は現在販売していないため注文できません
          deadline_passed: 注文の締切（提供日当日 %{deadline}）を過ぎているため注文できません
          too_far_ahead: 注文できるのは %{days} 日先の提供日までです
          unchangeable_status: '%{status}の注文は、個数の変更やキャンセルができません'
          change_deadline_passed: 締切（提供日当日 %{deadline}）を過ぎたため、個数の変更やキャンセルができません
          restoration_exceeds_remaining_stock: キャンセル済から戻すと残数を超えるため変更できません（この注文 %{quantity} 個、残り %{remaining_stock} 個）
          restoration_exceeds_daily_limit: キャンセル済から戻すと、この利用者の同じ提供日の注文が %{limit} 個を超えるため変更できません（この注文 %{quantity} 個、注文済み %{ordered_quantity} 個）
          attributes:
            delivery_area:
              inactive: は現在配達を受け付けていません
            quantity:
              exceeds_remaining_stock: は残り %{remaining_stock} 個以下にしてください
              exceeds_daily_limit: は、同じ提供日の注文と合わせて %{limit} 個までです（注文済み %{ordered_quantity} 個）
    models:
      user: 利用者
      admin: 管理者
      bento: 弁当
      delivery_area: 配達エリア
      daily_menu: 日別献立
      subscription: 定期注文設定
      order: 注文
      review: 評価
    attributes:
      user:
        name: 氏名
        email: メールアドレス
        phone_number: 電話番号
        password: パスワード
        password_confirmation: パスワード（確認）
        current_password: 現在のパスワード
        remember_me: ログインしたままにする
        orders: 注文
        subscriptions: 定期注文設定
      admin:
        name: 氏名
        email: メールアドレス
        password: パスワード
        password_confirmation: パスワード（確認）
      bento:
        name: 弁当名
        description: 説明
        bento_type: 弁当タイプ
        price: 価格（税抜）
        on_sale: 販売
        position: 表示順
        image: 画像
        daily_menus: 日別献立
      delivery_area:
        name: エリア名
        postal_code: 郵便番号
        active: 有効
        orders: 注文
        subscriptions: 定期注文設定
      daily_menu:
        served_on: 提供日
        bento: 弁当
        bento_id: 弁当
        stock_limit: 提供数上限
        remaining_stock: 残数
        orders: 注文
      subscription:
        user: 利用者
        wday: 曜日
        bento_type: 弁当タイプ
        quantity: 個数
        delivery_area: 配達エリア
        delivery_address: 配達先住所
        active: 有効
        orders: 注文
      order:
        user: 利用者
        daily_menu: 日別献立
        quantity: 個数
        delivery_area: 配達エリア
        delivery_address: 配達先住所
        unit_price: 単価
        discount_per_unit: 割引単価
        total_price: 合計金額
        status: ステータス
        subscription: 生成元の定期注文設定
        review: 評価
      review:
        order: 注文
        order_id: 注文
        rating: 評価
        comment: コメント
